[package]
name = "fuxi-events"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "伏羲 event bus: tokio broadcast + SQLite WAL persistence + replay"

[dependencies]
fuxi-core.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-stream = { workspace = true, features = ["sync"] }
futures-util.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true
uuid.workspace = true
async-trait.workspace = true

# TB.4 thesis-v2：事件总线纯压测（bench-only，bench 直接 await broadcast::Receiver
# 拿 Lagged drop 计数；fuxi-events 主体不直接吃 broadcast 类型）
[dev-dependencies]
tokio = { workspace = true, features = ["full", "rt-multi-thread", "macros", "time", "sync"] }

# TB.4 thesis-v2：事件总线纯压测
[[bench]]
name = "bus_stress"
harness = false
