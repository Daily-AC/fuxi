[package]
name = "fuxi-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "伏羲 CLI (binary entry `fuxi`)"

[[bin]]
name = "fuxi"
path = "src/main.rs"

[dependencies]
fuxi-core.workspace = true
fuxi-events.workspace = true
fuxi-a2a.workspace = true
fuxi-agent-cc.workspace = true
fuxi-firehose.workspace = true
fuxi-orchestrator.workspace = true
fuxi-workspace.workspace = true
fuxi-skills.workspace = true
fuxi-memory.workspace = true
fuxi-scheduler.workspace = true
tokio = { workspace = true, features = ["full"] }
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum.workspace = true
futures-util.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
crossterm.workspace = true
ratatui.workspace = true
chrono.workspace = true
url = "2"
uuid = { workspace = true }
# 社区成熟的 multi-line / paste-aware text editor widget（ratatui 0.29 兼容）
tui-textarea = { version = "0.7", default-features = false, features = ["ratatui", "crossterm"] }
# CJK 宽度正确计算——str.len() 会把中文当 3 字节，chars().count() 不懂东亚宽字符
unicode-width = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = "3"
fuxi-skills.workspace = true
