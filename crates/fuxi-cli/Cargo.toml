[package]
name = "fuxi-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "伏羲 CLI (binary entry `fuxi`)"
# benches/dist_bench_common.rs 是共享 helper（被 β/γ 的 bench `mod`-include），
# 不是独立 bench target——关闭 autobench，由 [[bench]] 显式枚举真 bench。
autobenches = false

[[bin]]
name = "fuxi"
path = "src/main.rs"

[[bench]]
name = "run_baseline"
path = "benches/run_baseline.rs"
harness = false

[dependencies]
fuxi-core.workspace = true
fuxi-events.workspace = true
fuxi-a2a.workspace = true
fuxi-agent-cc.workspace = true
fuxi-agent-codex.workspace = true
fuxi-firehose.workspace = true
fuxi-orchestrator.workspace = true
fuxi-workspace.workspace = true
fuxi-skills.workspace = true
fuxi-memory.workspace = true
fuxi-scheduler.workspace = true
fuxi-im.workspace = true
tokio = { workspace = true, features = ["full"] }
# CancellationToken：Decision 12 worker 真并发后给每个 in-flight job 发 cancel 信号
# （heartbeat ack 的 cancel_pending 路径 + 静默期 cancel 兜底）
tokio-util = { workspace = true }
async-trait.workspace = true
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum.workspace = true
# `fuxi im start` 把 PWA dist 目录挂在 `/` —— ServeDir 走 fs feature
tower-http = { version = "0.6", features = ["fs", "trace"] }
futures-util.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
reqwest = { version = "0.12", features = ["json"] }
crossterm.workspace = true
ratatui.workspace = true
chrono.workspace = true
url = "2"
uuid = { workspace = true }
# 社区成熟的 multi-line / paste-aware text editor widget（ratatui 0.29 兼容）
tui-textarea = { version = "0.7", default-features = false, features = ["ratatui", "crossterm"] }
# CJK 宽度正确计算——str.len() 会把中文当 3 字节，chars().count() 不懂东亚宽字符
unicode-width = "0.2"
# OSC52 clipboard escape 序列需要 base64（payload = base64(text)）
base64 = "0.22"
# Markdown 渲染——assistant 文本走 commonmark → Ratatui Spans；只用 parse 能力，
# 不要 html 渲染 feature，减小依赖面。
pulldown-cmark = { version = "0.13", default-features = false }
# /metrics endpoint 用单层 prometheus crate（自带 TextEncoder + Registry）
# 不上 metrics + metrics-exporter-prometheus 双层，多一层 indirection 没收益。
prometheus = { version = "0.13", default-features = false }
# 分布式 dist_jobs 持久化（path 4 α）：controller 重启后从 SQLite 重放 in-flight job。
# 不进 fuxi-events——dist 是 cli 层概念；直接引 workspace sqlx 即可。
sqlx.workspace = true
# dist HMAC 鉴权（path 3）
secrecy.workspace = true
hmac.workspace = true
sha2.workspace = true
lru.workspace = true
# axum middleware body 读取要 hyper Bytes + http_body_util 的 collect
http-body-util = "0.1"
bytes = "1"
# 常量时间比较——签名比对必须用 ct_eq 防 timing oracle
subtle = "2"
# nonce 用十六进制随机数；hex 同时用于签名输出格式
hex = "0.4"
rand = "0.8"

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = "3"
fuxi-skills.workspace = true
