[package]
name = "fuxi-agent-cc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "伏羲 Claude Code agent adapter (headless mode)"

[features]
# 开启后 `cargo test --features real_cc` 会跑 E2E；默认关闭避免消耗 API 额度。
real_cc = []

[dependencies]
fuxi-core.workspace = true
fuxi-a2a.workspace = true
tokio = { workspace = true, features = ["full"] }
# WS 反连模式（v0.1 薄片 H）· 替代原本的 stdio `--print` 路径。
# axum 提供 `ws` extractor 做反连 server（CLI 是 client），已在 workspace。
axum = { workspace = true, features = ["ws", "macros"] }
futures-util = { workspace = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true
uuid = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tracing-subscriber = { workspace = true }
# WS bridge 单测用它当"假 CLI"连回 axum server。
tokio-tungstenite = { workspace = true }
# Phase 0 ref-only：artifact dump 单测用 tempdir 替 ~/.fuxi/artifacts。
tempfile = "3"
