[package]
name = "fuxi-im"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "伏羲 IM 后端：axum 服务暴露任务/对话/intervene 给 PWA 移动端"

[dependencies]
fuxi-core.workspace = true
fuxi-events.workspace = true
fuxi-orchestrator.workspace = true
fuxi-workspace.workspace = true
tokio = { workspace = true, features = ["full"] }
# `multipart` feature 给 Task #17 的文件上传 handler 用 axum::extract::Multipart
axum = { workspace = true, features = ["multipart"] }
tower = { workspace = true }
tower-http = { version = "0.6", features = ["trace", "cors"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
chrono.workspace = true
uuid = { workspace = true }
sqlx.workspace = true
# γ · WS handler 用 StreamExt + Stream 做事件流 select。
futures-util.workspace = true
# β · HMAC-SHA256 device token；与 fuxi-cli/dist_auth 同协议族（公理 #6 借鉴不借代码）
hmac.workspace = true
sha2.workspace = true
secrecy.workspace = true
# 常量时间签名比较防 timing oracle（与 fuxi-cli 同版本）
subtle = "2"
# token 编码 base64url（不带 padding）
base64 = "0.22"
# 6 位 PIN + 32 字节 HMAC key 随机源
rand = "0.8"
# β · #9 主密码鉴权：bcrypt cost 12 是行业基线，0.15 跟当前 rust 生态主流版本对齐
bcrypt = "0.15"
# δ · async fn in trait + dyn dispatch（PushSender / hooks）
async-trait.workspace = true
# δ · VAPID + Web Push（hyper-client 复用 fuxi 已有 hyper 系；
# 默认 isahc 关掉以避第二个 HTTP 栈）
web-push = { version = "0.11", default-features = false, features = ["hyper-client"] }
# β · Task #17 文件上传：mime 类型校验 + axum 自带 Multipart 解析
mime = "0.3"
# β · Task #17 文件上传 + sha256 流式 hash（sha2 已在 hmac 路径引入复用）
hex = "0.4"

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = "3"
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
# γ WS 端到端测试：起真实 axum + 真实 ws/http 客户端，照抄 firehose/tests 模式。
tokio-tungstenite.workspace = true
reqwest = { version = "0.12", features = ["json"] }
url = "2"
