# 与 fuxi root workspace 隔离（jarvis-pet 是独立 Tauri 项目，不进 workspace）
[workspace]

[package]
name = "jarvis-pet"
version = "0.4.0"
edition = "2021"
description = "玄女桌宠 v0.4"

[lib]
name = "jarvis_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# devtools feature 让 release build 也能右键 inspect element + 看 console.log
# （否则 release 只有 dev mode 才有 inspector）
tauri = { version = "2", features = ["macos-private-api", "devtools"] }
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
# crates.io 版本对 Tauri 2 滞后（2026-05 实测 no matching package），走 git v2 分支
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
