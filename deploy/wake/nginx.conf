# wake.qmledmq.cn —— Mac 贾维斯 ↔ home fuxi-wake-server 反向通道
#
# 同 fuxi-im 模板：8443 ssl + 通配符证书 + proxy_pass 127.0.0.1:9101 + WS upgrade
# headers + 长连保持。WAKE_PROTOCOL.md 默认公网入口 wss://wake.qmledmq.cn/api/wake。
#
# 部署位置：`/etc/nginx/sites-enabled/wake`（独立文件，不改 sia-gateway/im）。
# install.sh 会 scp 这份文件并 nginx -t && systemctl reload nginx。

server {
    listen 8443 ssl;
    server_name wake.qmledmq.cn;

    ssl_certificate /etc/nginx/ssl/qmledmq.cn.crt;
    ssl_certificate_key /etc/nginx/ssl/qmledmq.cn.key;

    # WS 帧上限——单帧 1280 B PCM，nginx 默认 1m 富余够用
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:9101;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket：/api/wake 走 WS upgrade
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 唤醒会话长连——24h 上限给 macOS 长时间挂机充足窗口
        # （server 自身有 15s 入站静默 / 30s 客户端下行无响应保护，nginx 不再叠加更短窗口）
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
