    # GPT-SoVITS proxy ~/.fuxi/sovits-proxy.env 给的 token 鉴权——jarvis 派蒙音色出口
    # `=` 精确匹配优先于 `location /` catch-all，proxy_pass 末尾带 `/tts` 重写 prefix。
    location = /api/tts {
        proxy_pass http://127.0.0.1:9881/tts;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_http_version 1.1;
        # 推理 5090 < 0.5s + 网络余量；30s 兜底防 sovits 卡死。
        proxy_read_timeout 30;
        proxy_send_timeout 30;
        proxy_connect_timeout 5;
        # 关掉 buffering 让 wav binary 流式回客户端（payload 通常 < 200KB，影响小但
        # 减一份内存抖动）
        proxy_request_buffering off;
        proxy_buffering off;
    }
