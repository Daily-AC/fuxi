    # FunASR Paraformer-zh ASR—— 桌宠（jarvis-pet）的语音转写出口
    # 客户端 webview 走 WSS PCM 流到 :9882 /asr，token 走 start 帧不走 header
    # （Web WebSocket 不支持 custom header；HMAC 走帧体）
    location = /api/asr {
        proxy_pass http://127.0.0.1:9882/asr;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 音频上限 60s + 模型推理 1-3s + 余量。push-to-talk 短句够用。
        proxy_read_timeout 90;
        proxy_send_timeout 90;
        proxy_connect_timeout 5;
        proxy_buffering off;
        proxy_request_buffering off;
    }
