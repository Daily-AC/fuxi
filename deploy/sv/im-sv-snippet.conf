    # Speaker Verification —— 桌宠声纹注册 + 验证（CAM++ 中文）
    # 客户端走 HTTPS POST，body wav_b64 + JSON。鉴权 Authorization: Bearer <token>。
    # 注册：录 5-30s wav → /api/sv/enroll → 服务端存 owner.npy
    # 验证：录 ≥1s wav → /api/sv/verify → 返 {match, score, threshold, enrolled}
    location /api/sv/ {
        # Tauri webview = WebKit，POST 带 Authorization 触发 CORS preflight。
        # sv_server.py 是 FastAPI 没装 CORSMiddleware——必须 nginx 这层兜 OPTIONS，
        # 否则 preflight 透传到 :9883 返 405 / fetch 报 「TypeError: Load failed」。
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "POST, GET, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With";
            add_header Access-Control-Max-Age 3600;
            add_header Content-Length 0;
            return 204;
        }
        # 真实响应也加 Allow-Origin，否则 WebKit 看到无 header 仍 fail。
        # `always` 确保 4xx/5xx 也带——客户端能拿到错误体而非 opaque Load failed。
        add_header Access-Control-Allow-Origin "*" always;
        proxy_pass http://127.0.0.1:9883/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        # wav body 可能几 MB（30s 16kHz mono = ~960KB raw → wav header +
        # transport b64 膨胀 1.33x ≈ 1.3MB）；给到 5MB 留余量
        client_max_body_size 5m;
        proxy_read_timeout 30;
        proxy_send_timeout 30;
        proxy_connect_timeout 5;
        proxy_buffering off;
        proxy_request_buffering off;
    }
