# im.qmledmq.cn —— fuxi IM PWA + WS（Decision 14 B）
#
# 模板和现有 sia-gateway 内的 sia/term/voice 块同模式：8443 ssl + 通配符证书 +
# proxy_pass 127.0.0.1:9100 + WS upgrade headers + 长连保持。
#
# 部署位置：`/etc/nginx/sites-enabled/im`（独立文件，**不**改 sia-gateway）。
# install.sh 会 scp 这份文件并 nginx -t && systemctl reload nginx。

server {
    listen 8443 ssl;
    server_name im.qmledmq.cn;

    ssl_certificate /etc/nginx/ssl/qmledmq.cn.crt;
    ssl_certificate_key /etc/nginx/ssl/qmledmq.cn.key;

    # PWA 主体可能含 service worker 大文件 + IndexedDB 同步
    # #49 修：从 16m → 32m，给 multipart 上传留 boundary / headers slack
    # （axum 后端 DefaultBodyLimit 是 16m + 256KB；nginx 留 2x 余量防 boundary
    # 撑爆 multer——multer 把整个 part header 也算进 body 计数）
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:9100;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket：/api/conv + /api/tasks/:id/stream 都走 WS upgrade
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 玄女对话和 task stream 是长连——24h 上限给手机后台 PWA 充足窗口
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # #49 修：/api/upload 单独 location，关掉 proxy_request_buffering 让 multipart
    # 直接流式 forward 到 axum（默认 on 会先把整 body 缓存到磁盘 tmp 文件再转，
    # tmp 写失败 / chunked 编码兼容差，撞过 MultipartError {failed to read stream}）。
    # 必须放在 location / 之前 / 同级精确匹配——nginx 用最长 prefix 优先。
    location = /api/upload {
        proxy_pass http://127.0.0.1:9100;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # 关闭请求 body buffering——直接流式给 axum，multipart 不会被
        # nginx 临时落盘再切 chunk
        proxy_request_buffering off;
        # 上传过程长——给 5 分钟（默认 60s 移动网络上传中等大小图片不够）
        proxy_read_timeout 300;
        proxy_send_timeout 300;

        # HTTP/1.1 必须显式（关 buffering 时 nginx 默认 1.0 不支持 chunked forward）
        proxy_http_version 1.1;
    }
}
