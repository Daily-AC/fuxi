name: release

# tag `v*` 触发，cross-build fuxi-cli for linux/macos，推 GitHub Release。
# 一键安装入口（install-local-worker.sh）走 latest release 拉对应 platform asset。

on:
  push:
    tags: ["v*"]
  # 手动触发也行（workflow_dispatch 给开发期 dry-run 用）
  workflow_dispatch:

permissions:
  contents: write # 创建 release + upload assets 必需

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset: fuxi-linux-x86_64
          - target: aarch64-apple-darwin
            os: macos-14
            asset: fuxi-macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: build
        run: cargo build --release -p fuxi-cli --target ${{ matrix.target }}

      - name: archive
        shell: bash
        run: |
          set -e
          cd target/${{ matrix.target }}/release
          tar czf "$GITHUB_WORKSPACE/${{ matrix.asset }}.tar.gz" fuxi
          # sha256 给 install 脚本可选校验
          if command -v sha256sum >/dev/null; then
            sha256sum "$GITHUB_WORKSPACE/${{ matrix.asset }}.tar.gz" \
              | awk '{print $1}' > "$GITHUB_WORKSPACE/${{ matrix.asset }}.tar.gz.sha256"
          else
            shasum -a 256 "$GITHUB_WORKSPACE/${{ matrix.asset }}.tar.gz" \
              | awk '{print $1}' > "$GITHUB_WORKSPACE/${{ matrix.asset }}.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.tar.gz
            ${{ matrix.asset }}.tar.gz.sha256

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: list assets
        run: ls -la dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/fuxi-linux-x86_64.tar.gz
            dist/fuxi-linux-x86_64.tar.gz.sha256
            dist/fuxi-macos-aarch64.tar.gz
            dist/fuxi-macos-aarch64.tar.gz.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
