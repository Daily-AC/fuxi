[workspace]
resolver = "2"
members = [
    "crates/fuxi-core",
    "crates/fuxi-events",
    "crates/fuxi-a2a",
    "crates/fuxi-agent-cc",
    "crates/fuxi-agent-codex",
    "crates/fuxi-firehose",
    "crates/fuxi-im",
    "crates/fuxi-cli",
    "crates/fuxi-workspace",
    "crates/fuxi-orchestrator",
    "crates/fuxi-skills",
    "crates/fuxi-memory",
    "crates/fuxi-scheduler",
    "crates/fuxi-wake-server", "crates/home-qm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/e0_7/fuxi"

[workspace.dependencies]
# async runtime
tokio = { version = "1.42", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = "0.3"
async-trait = "0.1"

# http / ws
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tokio-tungstenite = "0.26"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# storage
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "chrono", "uuid", "macros"] }

# observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# ids / time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# errors
thiserror = "2"
anyhow = "1"

# cli + tui
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"

# auth / secrets
# 包裹 HMAC secret 防 panic / Debug 路径泄漏（path 3 dist HMAC 鉴权）
secrecy = "0.10"
hmac = "0.12"
sha2 = "0.10"
# bounded LRU 给 nonce 去重缓存——超出窗口的 nonce 由 timestamp gate 拦，
# LRU size=10000 是 belt-and-braces，避免极端高并发下 nonce 集合无界增长
lru = "0.12"

# internal
fuxi-core = { path = "crates/fuxi-core" }
fuxi-events = { path = "crates/fuxi-events" }
fuxi-a2a = { path = "crates/fuxi-a2a" }
fuxi-agent-cc = { path = "crates/fuxi-agent-cc" }
fuxi-agent-codex = { path = "crates/fuxi-agent-codex" }
fuxi-firehose = { path = "crates/fuxi-firehose" }
fuxi-im = { path = "crates/fuxi-im" }
fuxi-workspace = { path = "crates/fuxi-workspace" }
fuxi-orchestrator = { path = "crates/fuxi-orchestrator" }
fuxi-skills = { path = "crates/fuxi-skills" }
fuxi-memory = { path = "crates/fuxi-memory" }
fuxi-scheduler = { path = "crates/fuxi-scheduler" }

[profile.release]
lto = "thin"
codegen-units = 1
