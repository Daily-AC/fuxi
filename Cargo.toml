[workspace]
resolver = "2"
members = [
    "crates/fuxi-core",
    "crates/fuxi-events",
    "crates/fuxi-a2a",
    "crates/fuxi-agent-cc",
    "crates/fuxi-firehose",
    "crates/fuxi-cli",
    "crates/fuxi-workspace",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/e0_7/fuxi"

[workspace.dependencies]
# async runtime
tokio = { version = "1.42", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = "0.3"
async-trait = "0.1"

# http / ws
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tokio-tungstenite = "0.26"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# storage
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "chrono", "uuid", "macros"] }

# observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# ids / time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# errors
thiserror = "2"
anyhow = "1"

# cli + tui
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"

# internal
fuxi-core = { path = "crates/fuxi-core" }
fuxi-events = { path = "crates/fuxi-events" }
fuxi-a2a = { path = "crates/fuxi-a2a" }
fuxi-agent-cc = { path = "crates/fuxi-agent-cc" }
fuxi-firehose = { path = "crates/fuxi-firehose" }
fuxi-workspace = { path = "crates/fuxi-workspace" }

[profile.release]
lto = "thin"
codegen-units = 1
